Configuration for zram block devices is handled in a file called
zram-generator.conf. Each header, enclosed in brackets, represents one zram
device.

We have set up one zram block device, which should be sufficient for almost all
use cases. No further editing should be necessary. Nevertheless, these are the
options set in zram-generator.conf at this point:
    - zram-size: how much space the zram device may take up at most; set to
        half of available RAM, but at least 4096MB
    - compression-algorithm: what compression to use; set to zstd
